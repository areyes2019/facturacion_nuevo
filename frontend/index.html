<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facturación</title>

    <!-- Instalación como aplicación. El <link> del manifest lo inyecta vite-plugin-pwa en el
         build; lo de acá abajo es lo que el plugin no cubre: el color de la barra del sistema y
         el icono de iOS, que ignora los del manifest. -->
    <meta name="theme-color" content="#863bff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Facturación" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
